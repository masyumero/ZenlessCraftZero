[versions]
mixinExtras = "0.5.0"

# Curios
curios = "5.14.1+1.20.1"

# JEI, EMI, Jade
jei = "15.20.0.105"
emi = "1.1.13+1.20.1"
jade = "5390389" # 11.9.3

l2library = "9142545" # 2.5.5
placebo = "1.20.1-8.6.3"
